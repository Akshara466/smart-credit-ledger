
{% extends "base.html" %}
{% block title %}Add Customer | Smart Credit Ledger{% endblock %}

{% block content %}
<div class="form-card">
    <h1 class="page-title">Add New Customer</h1>
    <p class="text-secondary">Enter the customer's contact details.</p>

    <form action="/add-customer" method="post">
        <div class="mb-3">
            <label class="form-label" for="name">Customer Name *</label>
            <input class="form-control" id="name" name="name"
                   required maxlength="150" autocomplete="name">
        </div>
        <div class="mb-3">
            <label class="form-label" for="phone">Phone Number</label>
            <input class="form-control" id="phone" name="phone"
                   maxlength="30" autocomplete="tel">
        </div>
        <div class="mb-4">
            <label class="form-label" for="village">Village / Area</label>
            <input class="form-control" id="village" name="village"
                   maxlength="150">
        </div>
        <button type="submit" class="btn btn-primary">Save Customer</button>
        <a href="/customers" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
