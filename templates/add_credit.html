<!DOCTYPE html>
<html>
<head>
    <title>Add Credit</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Add Credit
        </h2>

        <form>

            <!-- Customer -->

            <div class="mb-3">
                <label class="form-label">
                    Customer
                </label>

                <select class="form-select">

                    <option selected disabled>
                        Select Customer
                    </option>

                    <option>
                        Akshara
                    </option>

                    <option>
                        Ramesh
                    </option>

                    <option>
                        Suresh
                    </option>

                </select>
            </div>

            <!-- Add New Customer -->

            <div class="mb-3">

                <a
                    href="/add-customer"
                    class="btn btn-outline-primary">
                    + Add New Customer
                </a>

            </div>

            <!-- Amount -->

            <div class="mb-3">
                <label class="form-label">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    class="form-control"
                    placeholder="Enter Amount">
            </div>

            <!-- Description -->

            <div class="mb-3">
                <label class="form-label">
                    Description
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Example: Rice, Sugar, Oil">
            </div>

            <!-- Date -->

            <div class="mb-4">
                <label class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    class="form-control">
            </div>

            <!-- Buttons -->

            <button
                type="submit"
                class="btn btn-success">
                Save Credit
            </button>

            <a
                href="/"
                class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
